syntax = "proto3";

package jsexecutor;

option go_package = "github.com/diegobermudez03/playhoot/game/session/jsexecutor/proto";

// Executor runs one authored-script execution inside a sandboxed JavaScript
// runtime. It holds no state between calls and no credential beyond what
// running that sandbox requires.
service Executor {
  rpc Execute(ExecuteRequest) returns (ExecuteResponse);
}

message ExecuteRequest {
  // Authored JavaScript source, sent inline.
  bytes script = 1;
  // Opaque JSON the script's own execute() function receives unexamined.
  bytes previous_state = 2;
  bytes event = 3;
  ExecutionContext context = 4;
}

message ExecutionContext {
  // RFC3339Nano timestamp; the only source of "current time" the script may
  // observe, real or otherwise.
  string logical_time = 1;
  // Decimal-string encoded random seed (may exceed a 64-bit integer's safe
  // range in some client languages, hence string rather than a fixed-width
  // integer type).
  string random_seed = 2;
  string acting_actor = 3;
}

message ExecuteResponse {
  oneof outcome {
    Success success = 1;
    Rejected rejected = 2;
  }
}

message Success {
  bytes new_state = 1;
  repeated bytes requested_commands = 2;
}

// Rejected means the script itself declined the input: it threw, returned a
// value that does not match the required shape, or defined no execute
// function. It is a business-level outcome, distinct from an RPC error,
// which indicates the Executor itself failed to run the script at all.
message Rejected {
  string reason = 1;
}
