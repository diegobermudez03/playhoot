<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Parqués</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #1b2b22;
        color: #f4f1e8;
        font-family: system-ui, sans-serif;
        user-select: none;
        touch-action: manipulation;
      }
      #app {
        display: grid;
        grid-template-rows: minmax(0, 1fr) auto;
        height: 100%;
      }
      @media (min-aspect-ratio: 5/4) {
        #app {
          grid-template-rows: none;
          grid-template-columns: minmax(0, 1fr) minmax(220px, 300px);
        }
      }
      #stage {
        position: relative;
        min-width: 0;
        min-height: 0;
      }
      #board {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        cursor: pointer;
      }
      #hud {
        display: flex;
        flex-direction: column;
        gap: 10px;
        padding: 12px;
        background: rgba(0, 0, 0, 0.25);
        min-height: 0;
        overflow: hidden;
      }
      #status {
        font-size: 1.15rem;
        font-weight: 700;
      }
      #timer {
        height: 4px;
        border-radius: 2px;
        background: rgba(255, 255, 255, 0.15);
        overflow: hidden;
      }
      #timer > div {
        height: 100%;
        background: #f4f1e8;
      }
      #players {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        font-size: 0.85rem;
      }
      .player {
        display: flex;
        align-items: center;
        gap: 5px;
        padding: 3px 8px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.08);
      }
      .player.turn {
        outline: 2px solid #f4f1e8;
      }
      .player.away {
        opacity: 0.45;
      }
      .swatch {
        width: 10px;
        height: 10px;
        border-radius: 50%;
      }
      #dice {
        display: flex;
        gap: 10px;
        font-size: 3rem;
        line-height: 1;
        min-height: 3rem;
      }
      #dice .used {
        opacity: 0.3;
      }
      #actions {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }
      button {
        font: inherit;
        font-weight: 700;
        padding: 10px 16px;
        border: 0;
        border-radius: 10px;
        background: #f4f1e8;
        color: #1b2b22;
        cursor: pointer;
      }
      button:disabled {
        opacity: 0.4;
        cursor: default;
      }
      #hint {
        min-height: 1.2em;
        font-size: 0.9rem;
        opacity: 0.85;
      }
      #log {
        margin: 0;
        padding: 0;
        list-style: none;
        font-size: 0.85rem;
        opacity: 0.8;
        overflow: hidden;
      }
      #log li {
        padding: 2px 0;
      }
    </style>
  </head>
